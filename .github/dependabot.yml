# Dependabot configuration for GopherQueue
version: 2
updates:
  # Maintain Go module dependencies at repository root
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10

  # Maintain npm/pnpm dependencies for Vue Dashboard in /web
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-web):"
    open-pull-requests-limit: 10

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci):"
    open-pull-requests-limit: 5
