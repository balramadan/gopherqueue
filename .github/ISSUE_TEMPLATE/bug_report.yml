name: Bug Report
description: Create a report to help us fix a bug in GopherQueue
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please fill out the form below as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or code snippets to reproduce the behavior.
      placeholder: |
        1. Initialize Server with options...
        2. Enqueue job...
        3. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Terminal Output
      description: Copy and paste relevant logs or stack traces here.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating System, Go version, Redis version.
      placeholder: Linux Mint 21 / Go 1.24 / Redis 7.2
    validations:
      required: true
