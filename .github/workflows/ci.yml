name: GopherQueue CI/CD Pipelines

on:
  push:
    branches: [main, master, dev, release/*]
  pull_request:
    branches: [main, master]

jobs:
  unit-test:
    name: Unit & Race Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.0.4-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run Unit Tests
        run: go test -v -race ./...

  build:
    name: Compile Binaries Check
    needs: [unit-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build GopherQueue Packages
        run: go build ./...

      - name: Build Standalone Server Binary
        run: go build -v -o bin/gopherq-server ./cmd/gopherq-server

      - name: Build Standalone Dashboard Binary
        run: go build -v -o bin/gopherq-dashboard ./cmd/gopherq-dashboard
