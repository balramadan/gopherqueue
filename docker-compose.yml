version: '3.8'

services:
  redis:
    image: redis:8.0.4-alpine
    container_name: gopherq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gopherq-network

  producer:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: gopherq-producer
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gopherq-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: gopherq-worker
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - WORKER_CONCURRENCY=10
      - QUEUE_NAME=default
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gopherq-network
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    container_name: gopherq-dashboard
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gopherq-network
    restart: unless-stopped

networks:
  gopherq-network:
    driver: bridge

volumes:
  redis_data:
    driver: local